name: Frontend acceptance
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  browser-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDENTITY_DB_PASSWORD: local-ci-identity-password
      TRACEABILITY_DB_PASSWORD: local-ci-traceability-password
      INTERNAL_AUTH_SECRET: local-ci-long-shared-secret-change-in-production
      APP_BASE_URL: http://localhost:4173
      BOOTSTRAP_PASSWORD: Sprint1-browser-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XTRACTA-EventOre/eventore-platform
          # Reviewed backend PR #1 revision. Update through a PR when the API changes.
          ref: 1f36dadbca325ca3166415b1902937139541db21
          path: .platform
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: docker compose up -d --build
        working-directory: .platform
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD identity node scripts/create-user.js demo@example.test 11111111-1111-4111-8111-111111111111
        working-directory: .platform
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color --tail=100
        working-directory: .platform
      - if: always()
        run: docker compose down --volumes
        working-directory: .platform
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
