name: Microservices acceptance
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - '.github/workflows/microservices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IDENTITY_DB_PASSWORD: local-ci-identity-password
      TRACEABILITY_DB_PASSWORD: local-ci-traceability-password
      INTERNAL_AUTH_SECRET: local-ci-long-shared-secret-change-in-production
      APP_BASE_URL: http://localhost:3000
      SMOKE_PASSWORD: Sprint2-smoke-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose up -d --build
      - run: docker compose exec -T -e BOOTSTRAP_PASSWORD=$SMOKE_PASSWORD identity node scripts/create-user.js smoke@example.test 11111111-1111-4111-8111-111111111111
      - run: node backend/scripts/smoke-microservices.js
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down --volumes
